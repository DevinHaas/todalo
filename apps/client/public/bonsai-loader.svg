<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 893 771.5" fill="none" overflow="visible">
<!-- The todalo bonsai shedding leaves: each leaf is a short stroke that drifts from the canopy to the base line. Used by loading splashes. -->
<style>
.leaf{transform-box:fill-box;transform-origin:center;opacity:0;animation:fall var(--t) cubic-bezier(.45,0,.55,1) var(--d) infinite}
@keyframes fall{
0%{transform:translate(0,0) rotate(0);opacity:0}
5%{opacity:1}
25%{transform:translate(calc(var(--dx)*1px),calc(var(--f)*.2px)) rotate(22deg)}
50%{transform:translate(calc(var(--dx)*-.7px),calc(var(--f)*.5px)) rotate(-18deg)}
72%{transform:translate(calc(var(--dx)*.6px),calc(var(--f)*.78px)) rotate(12deg)}
86%{transform:translate(calc(var(--dx)*.15px),calc(var(--f)*1px)) rotate(0);opacity:1}
100%{transform:translate(calc(var(--dx)*.15px),calc(var(--f)*1px)) rotate(0);opacity:0}}
@media (prefers-reduced-motion:reduce){.leaf{animation:none}}
</style>
<g stroke="#000000" stroke-width="14" stroke-linecap="round"><line x1="377" y1="33.7" x2="398" y2="33.7"/><line x1="442" y1="33.7" x2="509" y2="33.7"/><line x1="292" y1="73.1" x2="586" y2="73.1"/><line x1="239" y1="112.5" x2="670" y2="112.5"/><line x1="190" y1="151.9" x2="261" y2="151.9"/><line x1="290" y1="151.9" x2="316" y2="151.9"/><line x1="356" y1="151.9" x2="705" y2="151.9"/><line x1="125" y1="191.2" x2="397" y2="191.2"/><line x1="448" y1="191.2" x2="555" y2="191.2"/><line x1="604" y1="191.2" x2="708" y2="191.2"/><line x1="217" y1="230.6" x2="304" y2="230.6"/><line x1="371" y1="230.6" x2="466" y2="230.6"/><line x1="516" y1="230.6" x2="763" y2="230.6"/><line x1="200" y1="270" x2="224" y2="270"/><line x1="384" y1="270" x2="451" y2="270"/><line x1="498" y1="270" x2="801" y2="270"/><line x1="49" y1="309.4" x2="286" y2="309.4"/><line x1="415" y1="309.4" x2="483" y2="309.4"/><line x1="679" y1="309.4" x2="800" y2="309.4"/><line x1="86" y1="348.8" x2="297" y2="348.8"/><line x1="322" y1="348.8" x2="337" y2="348.8"/><line x1="405" y1="348.8" x2="430" y2="348.8"/><line x1="610" y1="348.8" x2="745" y2="348.8"/><line x1="21" y1="388.2" x2="435" y2="388.2"/><line x1="536" y1="388.2" x2="853" y2="388.2"/><line x1="414" y1="427.6" x2="464" y2="427.6"/><line x1="484" y1="427.6" x2="509" y2="427.6"/><line x1="561" y1="427.6" x2="711" y2="427.6"/><line x1="783" y1="427.6" x2="815" y2="427.6"/><line x1="431" y1="467" x2="489" y2="467"/><line x1="604" y1="467" x2="642" y2="467"/><line x1="409" y1="506.4" x2="480" y2="506.4"/><line x1="324" y1="545.8" x2="439" y2="545.8"/><line x1="275" y1="585.1" x2="365" y2="585.1"/><line x1="247" y1="624.5" x2="327" y2="624.5"/><line x1="237" y1="663.9" x2="321" y2="663.9"/><line x1="222" y1="703.3" x2="633" y2="703.3"/><line x1="42.6" y1="757.5" x2="850.4" y2="757.5"/></g>
<g stroke="#000000" stroke-width="14" stroke-linecap="round"><line class="leaf" x1="330" y1="191" x2="354" y2="191" style="--t:3.6s;--d:0s;--f:552;--dx:30"/><line class="leaf" x1="560" y1="230" x2="584" y2="230" style="--t:4.2s;--d:-1.1s;--f:513;--dx:-34"/><line class="leaf" x1="150" y1="309" x2="174" y2="309" style="--t:3.4s;--d:-2.3s;--f:434;--dx:38"/><line class="leaf" x1="700" y1="270" x2="724" y2="270" style="--t:4.0s;--d:-0.6s;--f:473;--dx:-42"/><line class="leaf" x1="440" y1="151" x2="464" y2="151" style="--t:4.6s;--d:-3.0s;--f:592;--dx:46"/><line class="leaf" x1="250" y1="348" x2="274" y2="348" style="--t:3.2s;--d:-1.7s;--f:395;--dx:-50"/><line class="leaf" x1="640" y1="348" x2="664" y2="348" style="--t:3.8s;--d:-2.8s;--f:395;--dx:54"/><line class="leaf" x1="520" y1="112" x2="544" y2="112" style="--t:4.4s;--d:-0.3s;--f:631;--dx:-58"/><line class="leaf" x1="90" y1="388" x2="114" y2="388" style="--t:3.5s;--d:-3.4s;--f:355;--dx:62"/><line class="leaf" x1="780" y1="388" x2="804" y2="388" style="--t:3.9s;--d:-1.4s;--f:355;--dx:-66"/></g>
</svg>
