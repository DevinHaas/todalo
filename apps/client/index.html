<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>todalo</title>
    <link rel="icon" type="image/svg+xml" href="/todalo-logo.svg" />
    <style>
      /* Launch splash: the mark on the theme background until React mounts into #root, which replaces it. */
      html { background: #ffffff; }
      html.dark { background: #1e1e1e; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot img { width: 96px; height: auto; animation: boot-in 500ms ease-out both; }
      html.dark .boot img { filter: invert(1); }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading todalo"><img src="/bonsai-loader.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
