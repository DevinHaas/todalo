[package]
name = "todalo-client"
version = "0.1.0"
description = "Todalo development client for Apple platforms"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1"
security-framework = "=3.7.0"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-opener = "2.7.2"
# Standard iOS haptics; its desktop build is a no-op (feedback.rs).
tauri-plugin-haptics = "=2.4.0"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# Goals ticket 14b: ritual-ready notifications, sent from the webview (notification:allow-notify).
tauri-plugin-notification = "2.8.0"
